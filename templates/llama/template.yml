apiVersion: v1
kind: Pod
metadata:
  name: llama
  labels:
    app: llama
  annotations:
    servicebay.label: "AI Engine (llama.cpp)"
    # v2 (#1344): llama-server binds 0.0.0.0 instead of 127.0.0.1 so isolated
    # sibling pods reach it through `host.containers.internal`; the LAN is
    # refused at the host firewall via LLAMA_PORT's `blockLanAccess` flag.
    # v3 (#1416): router mode. One process serves four presets and the client
    # picks with the `model` field; every model option moved out of this argv
    # into `presets.ini`, which post-deploy writes beside the weights. The
    # router itself refuses nothing, so it moved to LLAMA_ROUTER_PORT on
    # loopback and post-deploy's mode policy proxy holds LLAMA_PORT — same wide
    # bind, same firewall rule, plus the lease's `allowed` set. No data move;
    # needs a re-deploy so the pod is recreated on the new bind.
    servicebay.schema-version: "3"
    # Still LLAMA_PORT: that is the door consumers use and the port the
    # firewall rule has to target. LLAMA_ROUTER_PORT is loopback-only and
    # deliberately undeclared — nothing outside this box should find it.
    servicebay.ports: "{{LLAMA_PORT}}/tcp"
    # No `servicebay.tier` — like ollama this is opt-in AI infrastructure,
    # not a platform foundation. llama-server ships no auth and gets no proxy
    # route at all: its consumers are on-box only — the Solaris Engine on this
    # host netns, and isolated pods via `host.containers.internal`.
    # Through the policy proxy, which passes `/health` to the router: that is
    # the whole chain a consumer uses, and a dead proxy has to read as a dead
    # service. post-deploy additionally asks the household preset for a token,
    # which is the only signal that a model really serves (#1416).
    servicebay.healthcheck: |
      url: http://127.0.0.1:{{LLAMA_PORT}}/health
      interval: 30s
      timeout: 5s
      startup_timeout: 10m
spec:
  # hostNetwork so the policy proxy — a host process — reaches the router at
  # 127.0.0.1:{{LLAMA_ROUTER_PORT}}, and so the Solaris Engine reaches the
  # proxy on the same loopback. Same reason the ollama template used it.
  hostNetwork: true
  containers:
  - name: llama
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    # post-deploy downloads the GGUFs into {{DATA_DIR}}/llama/models and writes
    # `presets.ini` beside them before this container can serve; until they
    # land llama-server exits and the unit restarts, which is why nothing here
    # waits on them.
    args:
    # Loopback, and the router's own port (#1416). The wide bind #1344 needed
    # for `host.containers.internal` now belongs to the mode policy proxy
    # post-deploy installs on {{LLAMA_PORT}} — ADR-0007 Decision 3 is unchanged,
    # it is simply the proxy that carries it: it binds every interface, the
    # LAN is dropped by LLAMA_PORT's `blockLanAccess` nftables rule, and an
    # isolated pod still reaches it as `host.containers.internal`. The router
    # loads any preset it is asked for, which is why nothing but the proxy is
    # in a position to ask it.
    - "--host"
    - "127.0.0.1"
    - "--port"
    - "{{LLAMA_ROUTER_PORT}}"
    # Router mode (#1416). Every model option — weights, window, KV types, MTP
    # drafter, projector, alias — lives in `presets.ini`, one section per
    # preset, because a command-line argument outranks a preset option and
    # would apply one model's settings to all four. post-deploy writes that
    # file from LLAMA_MODEL_* (the household preset) and from the three leased
    # profiles it carries.
    - "--models-preset"
    - "/models/presets.ini"
    # One model resident at a time: the 16 GB card holds exactly one of these,
    # and the router evicts the idle one and loads the asked-for preset in
    # 9-19 s rather than OOMing on both (#1415).
    - "--models-max"
    - "1"
    # --jinja activates the chat template embedded in the GGUF — the
    # canonical Google Gemma-4 template. Without it llama-server falls back
    # to a generic template and Gemma's tool-call channel never renders. A
    # preset's child process inherits the router's command line, so this one
    # line covers all four.
    - "--jinja"
    ports:
    - containerPort: {{LLAMA_ROUTER_PORT}}
    # GPU passthrough (CDI). As with ollama (#1026) `podman kube play` drops
    # `resources.limits.nvidia.com/gpu`, so the real passthrough is done by
    # post-deploy.py's install_gpu_quadlet_fallback(): a `.container` Quadlet
    # with `AddDevice=nvidia.com/gpu=all` + `SecurityLabelDisable=true`.
    # BOTH are required here. Box-measured 2026-09-04: without the SELinux
    # relaxation llama-server logs one passing "no usable GPU found" warning,
    # loads the model into RAM and answers from the CPU — a perfectly
    # disguised false negative, not a failure.
    {{#LLAMA_GPU_PASSTHROUGH}}
    resources:
      limits:
        nvidia.com/gpu: "1"
    {{/LLAMA_GPU_PASSTHROUGH}}
    volumeMounts:
    - mountPath: /models
      name: llama-models
  volumes:
  - name: llama-models
    hostPath:
      path: {{DATA_DIR}}/llama/models
      type: DirectoryOrCreate
